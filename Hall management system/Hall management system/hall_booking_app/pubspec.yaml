name: hall_booking_app
description: Hall booking Flutter client for the Shaadi Ghar management system.
publish_to: "none"
version: 1.0.0+1
homepage: https://example.com/shaadi-ghar
repository: https://example.com/shaadi-ghar-repo
issue_tracker: https://example.com/shaadi-ghar-support
topics:
  - hall-booking
  - flutter
  - wedding-management

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  http: ^1.4.0
  table_calendar: ^3.0.9
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.2
  flutter_inappwebview: ^6.0.0
  razorpay_flutter: ^1.3.7
  add_2_calendar: ^3.0.1
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/login_banner.png
    - assets/wedding-landing-page-with-photo_52683-24467.avif
    - assets/hall_id_1.jpg
    - assets/hall_id_2.jpg
    - assets/hall_id_3.jpg
    - assets/hall_id_4.jpg
    - assets/hall_id_5.jpg
    - assets/images/halls/galaxy/
    - assets/images/halls/royal_fort/
    - assets/images/halls/pearl_palace/
    - assets/images/halls/dream_garden/
    - assets/images/halls/sunshine_villa/
